name: ci

on:
  pull_request: {}
  push:
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.8.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL dev dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        name: Install OpenSSL dev dependencies (Linux)
        run: sudo apt-get update -y && sudo apt-get install -y libssl-dev pkg-config
      - if: runner.os == 'macOS'
        name: Install OpenSSL (macOS)
        run: brew install openssl pkg-config
      - env:
          RUST_BACKTRACE: full
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --all-features
      - name: Ensure Cargo.lock is not modified
        run: git diff --exit-code Cargo.lock

  # How to release: Actions tab -> ci -> "Run workflow" -> enter tag.
  # softprops/action-gh-release creates the tag + release itself (authored by
  # github-actions), the first matrix job to finish creates it and the rest
  # just attach their assets. Never create the release manually.
  build-release:
    name: Build release executable (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
    env:
      BINARY_NAME: simple-http-server${{ endsWith(matrix.target, '-msvc') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        name: Install cross-compilation dependencies (Linux)
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools
      - if: runner.os == 'Linux'
        name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - if: runner.os == 'Linux'
        name: Build release binary (Linux via cross)
        env:
          OPENSSL_STATIC: 1
        run: cross build --release --no-default-features --bin simple-http-server --locked --target=${{ matrix.target }}
      - if: runner.os != 'Linux'
        name: Build release binary
        run: cargo build --release --no-default-features --bin simple-http-server --locked --target=${{ matrix.target }}
      # Unique asset name per target (a shared name would overwrite across
      # jobs). No .sha256 files: GitHub already shows a SHA256 per asset.
      - name: Prepare release asset
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          test -f "$BIN"
          mkdir -p dist
          cp "$BIN" "dist/simple-http-server-${{ matrix.target }}${{ endsWith(matrix.target, '-msvc') && '.exe' || '' }}"
      - name: Publish release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
