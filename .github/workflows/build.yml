name: ci

on:
  pull_request: {}
  push: {}
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL dev dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        name: Install OpenSSL dev dependencies (Linux)
        run: sudo apt-get update -y && sudo apt-get install -y libssl-dev pkg-config
      - if: runner.os == 'macOS'
        name: Install OpenSSL (macOS)
        run: brew install openssl pkg-config
      - env:
          RUST_BACKTRACE: full
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --all-features
      - name: Ensure Cargo.lock is not modified
        run: git diff --exit-code Cargo.lock

  build-release:
    name: Build release executable (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      BINARY_NAME: simple-http-server${{ endsWith(matrix.target, '-msvc') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        name: Install cross-compilation dependencies (Linux)
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools
      - if: runner.os == 'Linux'
        name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - if: runner.os == 'Linux'
        name: Build release binary (Linux via cross)
        env:
          OPENSSL_STATIC: 1
        run: cross build --release --no-default-features --bin simple-http-server --locked --target=${{ matrix.target }}
      - if: runner.os != 'Linux'
        name: Build release binary
        run: cargo build --release --no-default-features --bin simple-http-server --locked --target=${{ matrix.target }}
      - name: Evaluate sha256
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          test -f "$BIN"
          python3 -c "import hashlib; print(hashlib.sha256(open('$BIN','rb').read()).hexdigest(), end='')" > "$BIN.sha256"
          cat "$BIN.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}-${{ env.BINARY_NAME }}
          path: target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}-${{ env.BINARY_NAME }}.sha256
          path: target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.sha256
          if-no-files-found: error
      - name: Publish release artifacts
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}
            target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.sha256
